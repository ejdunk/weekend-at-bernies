name: weekend-at-bernies Daily Commits

on:
  schedule:
    # Run daily at 9:00 AM UTC on weekdays only (Monday=1 to Friday=5)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Configure Git
      run: |
        git config --local user.email "88873114+ejdunk@users.noreply.github.com"
        git config --local user.name "GitHub Action"
    
    - name: Run random daily commits script
      run: |
        echo "Current date: $(date)"
        echo "Git status before:"
        git status
        python daily_commit.py
        echo "Git status after:"
        git status
        echo "Recent commits:"
        git log --oneline -3
    
    - name: Commit and push data files
      run: |
        git add daily_data.json commit_log.txt
        if ! git diff --staged --quiet; then
          git commit -m "Update daily commit data files"
        fi
        # GitHub occasionally rejects a push with a transient server error
        # ("! [remote rejected] main -> main (failed)"), so retry a few times.
        # Pushing even when nothing was committed above also sends any commits
        # left behind if the push inside daily_commit.py failed.
        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          echo "Push attempt $attempt failed, retrying in $((attempt * 5))s..."
          sleep $((attempt * 5))
          git pull --rebase
        done
        git push # last attempt: if this fails, the step fails
    
    - name: Display commit status
      run: |
        echo "Latest commits:"
        git log --oneline -5